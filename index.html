<body>

  <div id="loader">
    <div class="spin"></div>
    <div class="t">Đang tải Portal Nhắc lịch chưa thanh toán…</div>
    <div class="s">Long Châu · Vaccine eCom</div>
  </div>

  <iframe id="frame" title="Portal Nhắc lịch chưa thanh toán" allowfullscreen></iframe>

  <script>
    (function () {
      var f = document.getElementById('frame');
      var loader = document.getElementById('loader');
      if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf('XXXX') !== -1) {
        loader.innerHTML = '<div class="t">Chưa cấu hình link Apps Script</div>' +
          '<div class="s">Mở index.html, dán Web app URL (/exec) vào biến APPS_SCRIPT_URL.</div>';
        return;
      }
      f.src = APPS_SCRIPT_URL;

      // Chỉ tắt màn hình ảnh Portal KHI dashboard bên trong báo đã render xong số liệu.
      // Dashboard gửi postMessage('dashboard-ready') khi ẩn overlay "Đang tải số liệu".
      var done = false;
      function hideLoader() { if (done) return; done = true; loader.classList.add('hide'); }

      window.addEventListener('message', function (ev) {
        if (ev.data === 'dashboard-ready') hideLoader();
      });

      // Mạng lưới an toàn: nếu sau 45 giây vẫn chưa nhận tín hiệu (mạng chậm bất thường)
      // thì tắt màn loading để không kẹt vĩnh viễn.
      setTimeout(hideLoader, 45000);
    })();
  </script>

</body>
</html>
